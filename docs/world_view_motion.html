<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活世界 · 她会动 (概念)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#3a3350,#211d30 60%);
       background-color:#191624;color:#e9e2d4;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:32px 20px}
  h1{font-size:18px;font-weight:600;margin-bottom:4px}
  .note{font-size:13px;color:#9a91b5;margin-bottom:20px}
  .stage-wrap{width:100%;max-width:820px}

  /* ===== 固定场景 ===== */
  .stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;
         background:linear-gradient(160deg,#241f38,#15121f);
         box-shadow:0 30px 70px -30px rgba(120,70,30,.5);border:1px solid #342c4a}
  /* night sky behind windows */
  .sky{position:absolute;inset:0;background:linear-gradient(180deg,#2b2a4d,#1d2540 70%,#222a44)}
  /* house body */
  .house{position:absolute;left:5%;top:7%;width:90%;height:86%;
         background:#efe0c4;border-radius:10px;border:3px solid #6b5238;overflow:hidden}
  .floor-line{position:absolute;left:0;right:0;top:50%;height:3px;background:#cdb389}
  .wall-v-top{position:absolute;left:50%;top:0;height:50%;width:3px;background:#cdb389}
  .wall-v-bot{position:absolute;left:55%;top:50%;height:50%;width:3px;background:#cdb389}
  .room-lbl{position:absolute;font-size:10px;color:#a98c63;letter-spacing:.04em}

  /* room ambient (current room glow) */
  .glow{position:absolute;width:46%;height:48%;border-radius:50%;pointer-events:none;
        background:radial-gradient(circle,rgba(255,224,160,.55),rgba(255,224,160,0) 70%);
        opacity:0;transition:all 1s ease;mix-blend-mode:screen}

  /* furniture (fixed) */
  .f{position:absolute;border-radius:6px}
  .bed{left:7%;top:30%;width:24%;height:13%;background:#cf9a52;box-shadow:inset 0 6px 0 #b9803a}
  .pillow{left:8%;top:31%;width:7%;height:6%;background:#efe2c6;border-radius:4px}
  .lamp-bed{left:30%;top:22%;width:5%;height:5%;border-radius:50%;background:#f6d98a;box-shadow:0 0 14px 4px rgba(246,217,138,.5)}
  .railing{left:56%;top:40%;width:38%;height:7%;background:repeating-linear-gradient(90deg,#9c7b4c 0 2px,transparent 2px 14px);border-bottom:3px solid #9c7b4c}
  .counter{left:6%;top:78%;width:34%;height:4%;background:#a8743f}
  .kettle{left:13%;top:71%;width:6%;height:7%;background:#c96a4a;border-radius:5px 5px 6px 6px}
  .kettle::before{content:"";position:absolute;right:-7px;top:30%;width:9px;height:4px;border:3px solid #a4543a;border-left:none;border-radius:0 6px 6px 0}
  .table{left:20%;top:82%;width:14%;height:8%;background:#8a5e33;border-radius:4px}
  .sofa{left:64%;top:80%;width:26%;height:9%;background:#7f9b6a;border-radius:10px;box-shadow:inset 0 7px 0 #93ac7d}
  .shelf{left:57%;top:64%;width:4%;height:20%;background:#8a5e33}
  .plant{left:88%;top:30%;width:7%;height:12%}
  .plant .pot{position:absolute;bottom:0;width:100%;height:42%;background:#b9683f;border-radius:3px}
  .plant .leaf{position:absolute;bottom:36%;left:18%;width:64%;height:70%;
               background:radial-gradient(circle at 50% 100%,#6fa364,#5f8f5a);border-radius:60% 60% 40% 40%}
  .floor-lamp{left:91%;top:62%;width:3%;height:24%;background:#7d5f3c}
  .floor-lamp::before{content:"";position:absolute;left:-80%;top:-8%;width:260%;height:14%;background:#f6d98a;border-radius:50%;box-shadow:0 0 18px 6px rgba(246,217,138,.45)}

  /* steam */
  .steam{position:absolute;left:14.5%;top:64%;width:10px;height:20px;opacity:0;transition:opacity .4s}
  .steam.on{opacity:1}
  .steam span{position:absolute;bottom:0;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.7);
              animation:rise 2.4s ease-in-out infinite}
  .steam span:nth-child(2){left:5px;animation-delay:.8s}
  .steam span:nth-child(3){left:2px;animation-delay:1.5s}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.7}100%{transform:translateY(-22px) scale(1.4);opacity:0}}

  /* ===== Neno (movable sprite) ===== */
  .neno{position:absolute;width:5.5%;height:13%;left:70%;top:70%;
        transition:left 1.4s cubic-bezier(.4,0,.2,1),top 1.4s cubic-bezier(.4,0,.2,1);z-index:5}
  .neno .aura{position:absolute;left:-40%;top:-25%;width:180%;height:150%;border-radius:50%;
              background:radial-gradient(circle,rgba(255,202,166,.6),transparent 70%);
              animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.75;transform:scale(1.08)}}
  .neno .body{position:absolute;bottom:0;left:18%;width:64%;height:58%;background:#d98c8c;border-radius:40% 40% 30% 30%}
  .neno .head{position:absolute;top:8%;left:28%;width:44%;height:40%;background:#f1b48d;border-radius:50%}
  .neno .hair{position:absolute;top:4%;left:24%;width:52%;height:26%;background:#5a3d2b;border-radius:50% 50% 30% 30%}
  /* walking bob */
  .neno.walking{animation:bob .5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
  /* tiny status bubble */
  .bubble{position:absolute;left:50%;top:-34%;transform:translateX(-50%);white-space:nowrap;
          background:rgba(40,30,20,.85);color:#fbeccf;font-size:11px;padding:3px 9px;border-radius:10px;
          opacity:0;transition:opacity .3s}
  .bubble.on{opacity:1}

  /* controls */
  .ctrl{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap;justify-content:center}
  .ctrl button{font:inherit;font-size:13px;color:#2a2230;background:#e6d3ad;border:none;
               padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600}
  .ctrl button.ghost{background:transparent;color:#c9bd9d;border:1px solid #443a58}
  .status{font-size:13px;color:#bcae8e;min-width:200px;text-align:center}
</style>
</head>
<body>
  <h1>她在固定的家里，自己走动 · 找东西 · 用东西</h1>
  <div class="note">场景和家具是画死的固定资产。她是会移动的精灵。点「步进一步」看她过日子（美术只是占位，最终换成手绘/像素游戏风）。</div>

  <div class="stage-wrap">
    <div class="stage">
      <div class="sky"></div>
      <div class="house">
        <div class="floor-line"></div>
        <div class="wall-v-top"></div>
        <div class="wall-v-bot"></div>

        <div class="room-lbl" style="left:3%;top:3%">卧室</div>
        <div class="room-lbl" style="left:53%;top:3%">阳台</div>
        <div class="room-lbl" style="left:3%;top:52%">厨房</div>
        <div class="room-lbl" style="left:57%;top:52%">客厅</div>

        <div class="glow" id="glow"></div>

        <!-- fixed furniture -->
        <div class="f bed"></div><div class="f pillow"></div><div class="lamp-bed"></div>
        <div class="f railing"></div>
        <div class="plant"><div class="leaf"></div><div class="pot"></div></div>
        <div class="f counter"></div><div class="f kettle"></div>
        <div class="f table"></div>
        <div class="f sofa"></div><div class="f shelf"></div>
        <div class="floor-lamp"></div>
        <div class="steam" id="steam"><span></span><span></span><span></span></div>

        <!-- movable Neno -->
        <div class="neno" id="neno">
          <div class="bubble" id="bubble"></div>
          <div class="aura"></div>
          <div class="hair"></div><div class="head"></div><div class="body"></div>
        </div>
      </div>
    </div>

    <div class="ctrl">
      <button onclick="step()">步进一步 →</button>
      <button class="ghost" onclick="toggleAuto()" id="autoBtn">自动播放</button>
      <div class="status" id="status">此刻：在客厅发呆</div>
    </div>
  </div>

<script>
  // 每个动作 = 一个目标位置 + 一句话 + 可选特效。真实版里这些由 /world-live 数据驱动。
  const acts = [
    {pos:[70,70], room:[55,55], say:"发呆",   text:"在客厅发呆",        steam:false},
    {pos:[12,62], room:[5,55],  say:"去烧水", text:"走去厨房…",          steam:false, walk:true},
    {pos:[12,62], room:[5,55],  say:"烧水中", text:"在厨房烧水 ☕",      steam:true},
    {pos:[70,70], room:[55,55], say:"读书",   text:"窝回沙发读书",      steam:true, walk:true},
    {pos:[86,30], room:[55,5],  say:"浇花",   text:"去阳台看看植物 🌿",  steam:true, walk:true},
    {pos:[18,30], room:[5,5],   say:"困了",   text:"回卧室，准备睡了 🌙", steam:false, walk:true},
  ];
  let i = 0, auto = null;
  const neno=document.getElementById('neno'), glow=document.getElementById('glow'),
        steam=document.getElementById('steam'), bubble=document.getElementById('bubble'),
        status=document.getElementById('status');

  function apply(a){
    if(a.walk){ neno.classList.add('walking'); setTimeout(()=>neno.classList.remove('walking'),1400); }
    neno.style.left=a.pos[0]+'%'; neno.style.top=a.pos[1]+'%';
    glow.style.left=a.room[0]+'%'; glow.style.top=a.room[1]+'%'; glow.style.opacity=.9;
    steam.classList.toggle('on', a.steam);
    bubble.textContent=a.say; bubble.classList.add('on');
    status.textContent='此刻：'+a.text;
  }
  function step(){ i=(i+1)%acts.length; apply(acts[i]); }
  function toggleAuto(){
    const b=document.getElementById('autoBtn');
    if(auto){ clearInterval(auto); auto=null; b.textContent='自动播放'; }
    else { auto=setInterval(step,2600); b.textContent='停止'; b.classList.remove('ghost'); }
  }
  apply(acts[0]);
</script>
</body>
</html>
