<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活世界 · 可视化概念</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #3a3350, #211d30 60%, #19162400);
    background-color: #191624;
    color: #e9e2d4;
    font-family: ui-sans-serif, system-ui, "PingFang SC", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 36px 20px;
  }
  .wrap { width: 100%; max-width: 940px; }
  .pretitle { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d84a8; margin-bottom: 8px; }
  .h { font-size: 19px; font-weight: 600; color: #f3ecdd; margin-bottom: 18px; }
  .h span { color: #9a91b5; font-weight: 400; font-size: 14px; }

  .card {
    display: grid; grid-template-columns: 1.7fr 1fr;
    background: #efe0c4;
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 2px 4px rgba(40,25,10,.2), 0 30px 70px -30px rgba(120,70,30,.55);
  }
  @media (max-width: 820px){ .card { grid-template-columns: 1fr; } }

  /* ---- 左：娃娃屋场景 ---- */
  .scene { position: relative; background: linear-gradient(160deg,#23203a,#161327); padding: 18px; }
  .scene svg { width: 100%; height: auto; display: block; }

  .legend {
    position: absolute; left: 26px; bottom: 24px;
    display: flex; gap: 14px; font-size: 11px; color: #cdbf9e;
  }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; }

  /* steam */
  @keyframes rise { 0%{ transform: translateY(0) scaleX(1); opacity:0 } 25%{opacity:.7} 100%{ transform: translateY(-26px) scaleX(1.5); opacity:0 } }
  .steam { animation: rise 2.6s ease-in-out infinite; transform-origin: bottom center; }
  .steam.s2 { animation-delay: .9s; }
  .steam.s3 { animation-delay: 1.7s; }
  /* neno breathing glow */
  @keyframes breathe { 0%,100%{ opacity:.5; r:34px } 50%{ opacity:.78; r:39px } }
  .aura { animation: breathe 4.2s ease-in-out infinite; }
  /* lamp flicker */
  @keyframes flick { 0%,100%{opacity:.9} 47%{opacity:.78} 50%{opacity:.96} 53%{opacity:.8} }
  .lamp { animation: flick 5s ease-in-out infinite; }

  /* ---- 右：注脚信息 ---- */
  .info {
    background: #fbf3e3; padding: 26px 24px;
    font-family: "Noto Serif SC", Georgia, serif; color: #4a3f31;
    display: flex; flex-direction: column;
  }
  .info .time { font-family: ui-sans-serif, system-ui; font-size:12px; color:#b39b76; letter-spacing:.04em; }
  .info .now-act { font-size: 18px; color:#3a3026; margin-top:10px; font-weight:600; }
  .info .inner { font-size: 13.5px; color:#9a8a72; font-style: italic; margin-top:8px; line-height:1.7;
                 border-left: 2px solid #e3c896; padding-left:11px; }
  .info .mood { margin-top:18px; display:flex; align-items:center; gap:9px; font-family: ui-sans-serif, system-ui; }
  .info .mood .swatch { width:30px; height:30px; border-radius:9px; background: linear-gradient(135deg,#86a0a8,#5f8088); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);}
  .info .mood .mt { font-size:11px; color:#b39b76; }
  .info .mood .mv { font-size:14px; color:#5f7f87; font-weight:600; }
  .info .stats { display:flex; gap:22px; margin-top:18px; font-family: ui-sans-serif, system-ui; }
  .info .stats .s .k { font-size:11px; color:#b39b76; }
  .info .stats .s .v { font-size:16px; color:#c2742f; font-weight:700; margin-top:3px; font-variant-numeric: tabular-nums;}
  .info hr { border:none; border-top:1px solid #ecdcc0; margin:20px 0 14px; }
  .info .plan-t { font-family: ui-sans-serif, system-ui; font-size:11px; color:#b39b76; margin-bottom:10px; letter-spacing:.03em;}
  .info .plan li { list-style:none; font-size:13.5px; color:#5a4d3c; display:flex; align-items:center; gap:9px; padding:4px 0; }
  .info .plan li::before{ content:""; width:7px;height:7px;border-radius:50%; background:#dcae6a; flex:none;}
  .info .plan li.done{ color:#b7ab97; text-decoration: line-through; }
  .info .plan li.done::before{ background:#d2c6ac; }
  .info .foot { margin-top:auto; padding-top:18px; font-family: ui-sans-serif, system-ui; font-size:11px; color:#bcab87;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="pretitle">Living World · 可视化概念</div>
    <div class="h">看见她，而不是读她 <span>· 同一份数据，画出来</span></div>

    <div class="card">
      <!-- 场景 -->
      <div class="scene">
        <svg viewBox="0 0 600 430" role="img" aria-label="Neno 的家 剖面图">
          <defs>
            <radialGradient id="warmlight" cx="50%" cy="40%" r="65%">
              <stop offset="0%" stop-color="#fff0cf" stop-opacity=".9"/>
              <stop offset="60%" stop-color="#f5cf86" stop-opacity=".22"/>
              <stop offset="100%" stop-color="#f5cf86" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffd9a3"/>
              <stop offset="55%" stop-color="#f6b27a"/>
              <stop offset="100%" stop-color="#e89aa0"/>
            </linearGradient>
            <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f6e9cf"/>
              <stop offset="100%" stop-color="#ecd9b4"/>
            </linearGradient>
            <radialGradient id="aura" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffcaa6" stop-opacity=".75"/>
              <stop offset="100%" stop-color="#ffcaa6" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="dim" cx="50%" cy="50%" r="75%">
              <stop offset="0%" stop-color="#1c1730" stop-opacity="0"/>
              <stop offset="100%" stop-color="#1c1730" stop-opacity=".42"/>
            </radialGradient>
          </defs>

          <!-- house shell -->
          <rect x="22" y="22" width="556" height="386" rx="16" fill="url(#wall)" stroke="#6b5238" stroke-width="3"/>
          <!-- room dividers -->
          <line x1="300" y1="30" x2="300" y2="400" stroke="#cdb389" stroke-width="3"/>
          <line x1="30" y1="218" x2="570" y2="218" stroke="#cdb389" stroke-width="3"/>

          <!-- room labels -->
          <text x="42" y="48" font-family="ui-sans-serif,system-ui" font-size="11" fill="#a98c63">卧室</text>
          <text x="318" y="48" font-family="ui-sans-serif,system-ui" font-size="11" fill="#a98c63">阳台</text>
          <text x="42" y="240" font-family="ui-sans-serif,system-ui" font-size="11" fill="#a98c63">厨房</text>
          <text x="318" y="240" font-family="ui-sans-serif,system-ui" font-size="11" fill="#a98c63">客厅 · 她在这</text>

          <!-- ===== 卧室 (top-left) ===== -->
          <g>
            <!-- bed -->
            <rect x="58" y="120" width="150" height="74" rx="10" fill="#cd922f" opacity=".25"/>
            <rect x="58" y="120" width="150" height="74" rx="10" fill="none" stroke="#b9803a" stroke-width="2"/>
            <rect x="66" y="128" width="46" height="58" rx="7" fill="#e8d9bd"/> <!-- pillow -->
            <rect x="58" y="120" width="150" height="22" rx="10" fill="#b9803a" opacity=".4"/>
            <!-- lamp -->
            <line x1="184" y1="120" x2="184" y2="92" stroke="#9c7b4c" stroke-width="2"/>
            <circle cx="184" cy="86" r="9" fill="#f6d98a"/>
          </g>

          <!-- ===== 阳台 (top-right) 含晨光天空 ===== -->
          <g>
            <rect x="408" y="64" width="150" height="92" rx="8" fill="url(#sky)"/>
            <circle cx="528" cy="92" r="13" fill="#fff3d0" opacity=".9"/>
            <!-- window frame -->
            <rect x="408" y="64" width="150" height="92" rx="8" fill="none" stroke="#9c7b4c" stroke-width="3"/>
            <line x1="483" y1="64" x2="483" y2="156" stroke="#9c7b4c" stroke-width="2"/>
            <line x1="408" y1="110" x2="558" y2="110" stroke="#9c7b4c" stroke-width="2"/>
            <!-- potted plant (healthy) -->
            <rect x="330" y="170" width="34" height="26" rx="4" fill="#b9683f"/>
            <path d="M347 170 C 334 150, 332 132, 344 124 C 348 138, 350 150, 347 170 Z" fill="#5f8f5a"/>
            <path d="M347 170 C 360 152, 366 138, 356 126 C 350 140, 346 154, 347 170 Z" fill="#6fa364"/>
            <path d="M347 172 C 347 156, 348 142, 350 132" stroke="#4d7a48" stroke-width="2" fill="none"/>
          </g>

          <!-- ===== 厨房 (bottom-left) 含烧水冒气 ===== -->
          <g>
            <!-- counter -->
            <rect x="42" y="330" width="240" height="20" rx="5" fill="#a8743f"/>
            <rect x="42" y="350" width="240" height="40" fill="#8a5e33" opacity=".35"/>
            <!-- kettle -->
            <g transform="translate(96,288)">
              <rect x="0" y="14" width="46" height="30" rx="8" fill="#c96a4a"/>
              <rect x="6" y="6" width="20" height="10" rx="3" fill="#a4543a"/>
              <path d="M46 22 q 14 2 12 16" stroke="#a4543a" stroke-width="4" fill="none"/>
              <!-- steam -->
              <g fill="#fff" opacity=".0">
                <ellipse class="steam"  cx="14" cy="6" rx="3.4" ry="6" fill="#ffffff"/>
                <ellipse class="steam s2" cx="22" cy="6" rx="3" ry="5.5" fill="#ffffff"/>
                <ellipse class="steam s3" cx="30" cy="6" rx="3.2" ry="6" fill="#ffffff"/>
              </g>
            </g>
            <!-- shelf jars -->
            <rect x="200" y="288" width="14" height="22" rx="3" fill="#d7a14e"/>
            <rect x="220" y="292" width="14" height="18" rx="3" fill="#c2742f"/>
            <rect x="240" y="286" width="14" height="24" rx="3" fill="#9c7b4c"/>
          </g>

          <!-- ===== 客厅 (bottom-right) 她在这读书 ===== -->
          <!-- warm light pool over current room -->
          <ellipse cx="438" cy="312" rx="150" ry="120" fill="url(#warmlight)"/>
          <g>
            <!-- bookshelf -->
            <rect x="316" y="252" width="26" height="120" rx="4" fill="#8a5e33"/>
            <rect x="320" y="258" width="18" height="5" fill="#d7a14e"/>
            <rect x="320" y="270" width="18" height="5" fill="#c2742f"/>
            <rect x="320" y="282" width="18" height="5" fill="#9c7b4c"/>
            <rect x="320" y="294" width="18" height="5" fill="#cf8f5e"/>
            <!-- sofa -->
            <rect x="360" y="330" width="170" height="44" rx="12" fill="#b8794a"/>
            <rect x="360" y="312" width="170" height="26" rx="10" fill="#cf8f5e"/>
            <rect x="356" y="320" width="20" height="54" rx="9" fill="#a4673c"/>
            <rect x="514" y="320" width="20" height="54" rx="9" fill="#a4673c"/>
            <!-- floor lamp -->
            <line x1="544" y1="372" x2="544" y2="300" stroke="#7d5f3c" stroke-width="3"/>
            <path class="lamp" d="M530 300 h28 l-7 16 h-14 z" fill="#f6d98a"/>
            <circle class="lamp" cx="544" cy="306" r="16" fill="#ffe9b0" opacity=".5"/>

            <!-- Neno sitting reading -->
            <circle class="aura" cx="440" cy="322" r="34" fill="url(#aura)"/>
            <g transform="translate(440,320)">
              <ellipse cx="0" cy="20" rx="20" ry="15" fill="#e8956b"/>      <!-- body -->
              <circle cx="0" cy="-2" r="13" fill="#f1b48d"/>                 <!-- head -->
              <path d="M-13 -6 a13 13 0 0 1 26 0 q -13 -9 -26 0" fill="#5a3d2b"/> <!-- hair -->
              <!-- open book -->
              <g transform="translate(0,16)">
                <path d="M-16 6 L0 0 L0 12 L-16 18 Z" fill="#fbf3e3" stroke="#cbb78d"/>
                <path d="M16 6 L0 0 L0 12 L16 18 Z" fill="#fdf8ee" stroke="#cbb78d"/>
              </g>
            </g>
          </g>

          <!-- dim non-current rooms slightly -->
          <rect x="30" y="30" width="270" height="188" fill="url(#dim)" opacity=".5"/>
          <rect x="300" y="30" width="270" height="188" fill="url(#dim)" opacity=".5"/>
          <rect x="30" y="218" width="270" height="182" fill="url(#dim)" opacity=".5"/>
        </svg>

        <div class="legend">
          <span><i style="background:#f5cf86"></i>她所在</span>
          <span><i style="background:#fff"></i>水正烧着</span>
          <span><i style="background:#6fa364"></i>植物健康</span>
        </div>
      </div>

      <!-- 注脚 -->
      <div class="info">
        <div class="time">早上 8:30 · 客厅</div>
        <div class="now-act">正在读一本书</div>
        <div class="inner">"想用书里的故事，<br>暂时躲开眼前的不安。"</div>

        <div class="mood">
          <div class="swatch"></div>
          <div><div class="mt">此刻心情</div><div class="mv">有点不安</div></div>
        </div>

        <div class="stats">
          <div class="s"><div class="k">精力</div><div class="v">62</div></div>
          <div class="s"><div class="k">钱包</div><div class="v">¥120</div></div>
        </div>

        <hr>
        <div class="plan-t">今天想做的</div>
        <ul class="plan">
          <li>把那本书读一会儿</li>
          <li>收拾一下屋子</li>
          <li>早点休息</li>
        </ul>

        <div class="foot">水壶还烧着 · 阳台的花昨天浇过</div>
      </div>
    </div>
  </div>
</body>
</html>
