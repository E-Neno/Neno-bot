<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生活世界 · 镜头跟着她 (概念)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#3a3350,#211d30 60%);
       background-color:#191624;color:#e9e2d4;font-family:ui-sans-serif,system-ui,"PingFang SC",sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:30px 18px}
  h1{font-size:18px;font-weight:600;margin-bottom:4px}
  .note{font-size:13px;color:#9a91b5;margin-bottom:18px;max-width:760px;text-align:center}
  .frame{width:100%;max-width:760px}

  /* ===== 视口：一次只看一间，多出来的邻屋在边上虚虚地露一点 ===== */
  .viewport{position:relative;width:100%;height:440px;border-radius:18px;overflow:hidden;
            border:1px solid #342c4a;box-shadow:0 30px 70px -30px rgba(120,70,30,.5);background:#15121f}
  /* 整个家：一条横向连起来的房间带，靠平移让镜头跟人 */
  .world{position:absolute;top:0;left:0;height:100%;width:2240px;display:flex;
         transition:transform 1.6s cubic-bezier(.4,0,.2,1)}
  .room{position:relative;width:560px;height:100%;border-right:3px solid rgba(107,82,56,.5);overflow:hidden}
  .room .back{position:absolute;inset:0}
  .room .dim{position:absolute;inset:0;background:#120f1f;opacity:.5;transition:opacity 1.2s;pointer-events:none}
  .room.active .dim{opacity:0}
  .floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,#7d5a36,#5e4327)}
  .rlabel{position:absolute;left:16px;top:14px;font-size:11px;letter-spacing:.05em;color:#cdb389;
          background:rgba(20,14,25,.45);padding:3px 9px;border-radius:8px}

  /* 房间底色（写实版这里换成室内渲染图） */
  .bedroom .back{background:linear-gradient(180deg,#46405f,#2e2942)}
  .living  .back{background:linear-gradient(180deg,#4a3f5a,#322a40)}
  .kitchen .back{background:linear-gradient(180deg,#433a4f,#2c2638)}
  .balcony .back{background:linear-gradient(180deg,#2b2a4d,#1d2540 70%,#222a44)}

  /* 暖光池：当前房间才亮 */
  .pool{position:absolute;left:50%;bottom:8%;width:90%;height:80%;transform:translateX(-50%);
        background:radial-gradient(circle at 50% 70%,rgba(255,224,160,.5),rgba(255,224,160,0) 70%);
        opacity:0;transition:opacity 1.2s;mix-blend-mode:screen}
  .room.active .pool{opacity:1}

  /* 家具（占位） */
  .f{position:absolute;border-radius:6px}
  .bed{left:60px;bottom:26%;width:230px;height:90px;background:#cf9a52;box-shadow:inset 0 9px 0 #b9803a}
  .pillow{left:72px;bottom:30%;width:64px;height:54px;background:#efe2c6;border-radius:6px}
  .lamp{width:46px;height:46px;border-radius:50%;background:#f6d98a;box-shadow:0 0 22px 8px rgba(246,217,138,.5)}
  .sofa{left:150px;bottom:26%;width:280px;height:96px;background:#7f9b6a;border-radius:14px;box-shadow:inset 0 10px 0 #93ac7d}
  .shelf{left:40px;bottom:26%;width:60px;height:200px;background:#8a5e33;border-radius:4px}
  .floorlamp{right:70px;bottom:26%;width:10px;height:230px;background:#7d5f3c}
  .floorlamp::before{content:"";position:absolute;left:-90%;top:-6%;width:280%;height:9%;background:#f6d98a;border-radius:50%;box-shadow:0 0 22px 9px rgba(246,217,138,.5)}
  .counter{left:50px;bottom:26%;width:380px;height:40px;background:#a8743f;border-radius:5px}
  .kettle{left:120px;bottom:calc(26% + 40px);width:54px;height:60px;background:#c96a4a;border-radius:6px}
  .kettle::before{content:"";position:absolute;right:-14px;top:30%;width:14px;height:8px;border:5px solid #a4543a;border-left:none;border-radius:0 8px 8px 0}
  .window{position:absolute;border:4px solid #9c7b4c;border-radius:6px}
  .railing{left:40px;bottom:26%;width:480px;height:60px;background:repeating-linear-gradient(90deg,#9c7b4c 0 3px,transparent 3px 22px);border-bottom:4px solid #9c7b4c}
  .plant{right:60px;bottom:26%;width:64px;height:120px}
  .plant .pot{position:absolute;bottom:0;width:100%;height:42%;background:#b9683f;border-radius:4px}
  .plant .leaf{position:absolute;bottom:36%;left:16%;width:68%;height:78%;background:radial-gradient(circle at 50% 100%,#6fa364,#5f8f5a);border-radius:60% 60% 40% 40%}
  .city{position:absolute;left:40px;top:60px;width:480px;height:150px;
        background:repeating-linear-gradient(90deg,#2a3354 0 30px,#222a48 30px 60px);opacity:.7;border-radius:4px}
  .city::after{content:"";position:absolute;inset:0;background:
     radial-gradient(4px 4px at 60px 40px,#ffd98a,transparent),
     radial-gradient(4px 4px at 160px 90px,#ffd98a,transparent),
     radial-gradient(4px 4px at 300px 50px,#ffd98a,transparent),
     radial-gradient(4px 4px at 420px 110px,#ffd98a,transparent)}

  /* 蒸汽 */
  .steam{position:absolute;left:138px;bottom:calc(26% + 96px);width:14px;height:26px;opacity:0;transition:opacity .4s}
  .steam.on{opacity:1}
  .steam span{position:absolute;bottom:0;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7);animation:rise 2.4s ease-in-out infinite}
  .steam span:nth-child(2){left:6px;animation-delay:.8s}
  .steam span:nth-child(3){left:3px;animation-delay:1.5s}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.7}100%{transform:translateY(-26px) scale(1.5);opacity:0}}

  /* ===== 她（在“家”这条带子里用绝对坐标，镜头靠平移跟随） ===== */
  .neno{position:absolute;bottom:24%;left:300px;width:50px;height:118px;z-index:6;
        transition:left 1.6s cubic-bezier(.4,0,.2,1)}
  .neno .aura{position:absolute;left:-40%;top:-22%;width:180%;height:150%;border-radius:50%;
              background:radial-gradient(circle,rgba(255,202,166,.6),transparent 70%);animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.75;transform:scale(1.08)}}
  .neno .body{position:absolute;bottom:0;left:18%;width:64%;height:56%;background:#d98c8c;border-radius:40% 40% 30% 30%}
  .neno .head{position:absolute;top:6%;left:28%;width:44%;height:38%;background:#f1b48d;border-radius:50%}
  .neno .hair{position:absolute;top:2%;left:24%;width:52%;height:24%;background:#5a3d2b;border-radius:50% 50% 30% 30%}
  .neno.walking{animation:bob .5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .neno .bubble{position:absolute;left:50%;top:-30px;transform:translateX(-50%);white-space:nowrap;
        background:rgba(40,30,20,.85);color:#fbeccf;font-size:11px;padding:3px 9px;border-radius:10px;opacity:0;transition:opacity .3s}
  .neno .bubble.on{opacity:1}

  /* 视口暗角，强化“看进一个房间”的纵深 */
  .vignette{position:absolute;inset:0;pointer-events:none;
            box-shadow:inset 0 0 120px 40px rgba(15,12,25,.7);border-radius:18px}

  /* 角落小地图：管纵览 */
  .minimap{position:absolute;right:12px;top:12px;display:flex;gap:5px;z-index:8;
           background:rgba(20,14,25,.5);padding:6px;border-radius:10px;backdrop-filter:blur(3px)}
  .minimap .cell{width:26px;height:18px;border-radius:4px;background:#3a3350;border:1px solid #4a4366;
                 transition:all .4s;position:relative}
  .minimap .cell.on{background:#f5cf86;border-color:#f5cf86}
  .minimap .cell span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;color:#cdb389}
  .minimap .cell.on span{color:#3a3026}

  .ctrl{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .ctrl button{font:inherit;font-size:13px;color:#2a2230;background:#e6d3ad;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600}
  .ctrl button.ghost{background:transparent;color:#c9bd9d;border:1px solid #443a58}
  .status{font-size:13px;color:#bcae8e;min-width:220px;text-align:center}
</style>
</head>
<body>
  <h1>镜头跟着她 · 一次看一个房间</h1>
  <div class="note">不再上帝视角看全屋。你“跟着她”，她走到哪、镜头就移到哪，房间看得大、看得近，像和她在一个屋里。右上小地图管纵览。（家具是占位，写实版换成室内渲染图）</div>

  <div class="frame">
    <div class="viewport">
      <div class="world" id="world">
        <!-- 卧室 -->
        <div class="room bedroom" data-room="0">
          <div class="back"></div>
          <div class="pool"></div>
          <div class="floor"></div>
          <div class="window" style="right:60px;top:60px;width:160px;height:130px"></div>
          <div class="f bed"></div><div class="f pillow"></div>
          <div class="lamp" style="right:240px;bottom:calc(26% + 90px)"></div>
          <div class="rlabel">卧室</div><div class="dim"></div>
        </div>
        <!-- 客厅 -->
        <div class="room living" data-room="1">
          <div class="back"></div>
          <div class="pool"></div>
          <div class="floor"></div>
          <div class="window" style="right:50px;top:50px;width:200px;height:150px"></div>
          <div class="f shelf"></div><div class="f sofa"></div><div class="floorlamp"></div>
          <div class="rlabel">客厅</div><div class="dim"></div>
        </div>
        <!-- 厨房 -->
        <div class="room kitchen" data-room="2">
          <div class="back"></div>
          <div class="pool"></div>
          <div class="floor"></div>
          <div class="f counter"></div><div class="f kettle"></div>
          <div class="steam" id="steam"><span></span><span></span><span></span></div>
          <div class="rlabel">厨房</div><div class="dim"></div>
        </div>
        <!-- 阳台 -->
        <div class="room balcony" data-room="3">
          <div class="back"></div>
          <div class="city"></div>
          <div class="pool"></div>
          <div class="floor"></div>
          <div class="f railing"></div>
          <div class="plant"><div class="leaf"></div><div class="pot"></div></div>
          <div class="rlabel">阳台</div><div class="dim"></div>
        </div>

        <!-- 她 -->
        <div class="neno" id="neno">
          <div class="bubble" id="bubble"></div>
          <div class="aura"></div><div class="hair"></div><div class="head"></div><div class="body"></div>
        </div>
      </div>

      <div class="vignette"></div>
      <div class="minimap" id="minimap">
        <div class="cell"><span>卧</span></div>
        <div class="cell"><span>厅</span></div>
        <div class="cell"><span>厨</span></div>
        <div class="cell"><span>台</span></div>
      </div>
    </div>

    <div class="ctrl">
      <button onclick="step()">步进一步 →</button>
      <button class="ghost" onclick="toggleAuto()" id="autoBtn">自动播放</button>
      <div class="status" id="status">此刻：在客厅读书</div>
    </div>
  </div>

<script>
  const ROOM_W=560, VW=760, WORLD_W=2240;
  // 每个动作：房间序号 + 房间内 x + 一句话 + 状态文案 + 蒸汽
  const acts=[
    {room:1, x:340, say:"读书",   text:"窝在客厅沙发读书",   steam:false},
    {room:2, x:150, say:"去烧水", text:"走去厨房…",          steam:false, walk:true},
    {room:2, x:150, say:"烧水中", text:"在厨房烧水 ☕",       steam:true},
    {room:3, x:430, say:"看花",   text:"去阳台看看植物 🌿",   steam:true, walk:true},
    {room:0, x:180, say:"困了",   text:"回卧室，准备睡了 🌙", steam:false, walk:true},
    {room:1, x:340, say:"发呆",   text:"又回到客厅发呆",      steam:false, walk:true},
  ];
  let i=0, auto=null;
  const world=document.getElementById('world'), neno=document.getElementById('neno'),
        steam=document.getElementById('steam'), bubble=document.getElementById('bubble'),
        status=document.getElementById('status'),
        rooms=[...document.querySelectorAll('.room')],
        cells=[...document.querySelectorAll('.minimap .cell')];

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function apply(a){
    const worldX = a.room*ROOM_W + a.x;            // 她在“整个家”里的绝对位置
    if(a.walk){ neno.classList.add('walking'); setTimeout(()=>neno.classList.remove('walking'),1600); }
    neno.style.left = worldX+'px';
    // 镜头：把她放到视口中间，并夹住别露出边界
    const cam = clamp(-(worldX - VW/2), -(WORLD_W-VW), 0);
    world.style.transform = `translateX(${cam}px)`;
    // 当前房间高亮，其余压暗
    rooms.forEach((r,idx)=>r.classList.toggle('active', idx===a.room));
    cells.forEach((c,idx)=>c.classList.toggle('on', idx===a.room));
    steam.classList.toggle('on', a.steam);
    bubble.textContent=a.say; bubble.classList.add('on');
    status.textContent='此刻：'+a.text;
  }
  function step(){ i=(i+1)%acts.length; apply(acts[i]); }
  function toggleAuto(){
    const b=document.getElementById('autoBtn');
    if(auto){clearInterval(auto);auto=null;b.textContent='自动播放';}
    else{auto=setInterval(step,2800);b.textContent='停止';b.classList.remove('ghost');}
  }
  apply(acts[0]);
</script>
</body>
</html>
