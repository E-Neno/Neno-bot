<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neno 世界引擎骨架 · 客厅</title>
<style>
  html,body { margin:0; background:#15121a; color:#cfc6d6; font-family:-apple-system,"Microsoft YaHei",sans-serif; }
  #wrap { max-width:980px; margin:0 auto; padding:16px; }
  h1 { font-size:16px; font-weight:500; margin:0 0 4px; }
  .sub { font-size:12px; color:#8a8294; margin:0 0 12px; }
  #game { width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:#0e0c12; }
  .bar { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .bar input { flex:1; min-width:200px; padding:8px 10px; border-radius:8px; border:1px solid #3a3344; background:#1c1824; color:#cfc6d6; }
  .bar button { padding:8px 14px; border-radius:8px; border:1px solid #4a4258; background:#241f2e; color:#cfc6d6; cursor:pointer; }
  .rooms { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .rooms button { padding:6px 10px; border-radius:7px; border:1px solid #3a3344; background:#1c1824; color:#bdb3c8; cursor:pointer; }
  #status { font-size:12px; color:#8a8294; margin-top:8px; min-height:16px; }
  .legend { font-size:12px; color:#8a8294; margin-top:10px; line-height:1.7; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Neno 世界引擎骨架 · 客厅（Phase 0）</h1>
  <p class="sub">5 层结构 + 深度排序 + 真快照驱动 + Matter 物理。美术 emoji 占位，codex 在此基础上盖楼。</p>
  <div id="game"></div>
  <div class="bar">
    <input id="tok" type="password" placeholder="Admin Token（控制台登录过会自动带）">
    <button id="go">连接世界</button>
    <button id="bump">推一下挂植（摆）</button>
    <button id="drop">丢几个球（看物理）</button>
  </div>
  <div class="rooms" id="rooms"></div>
  <div id="status">就绪。</div>
  <div class="legend">
    <b>物理在哪：</b>切到「客厅」看右上挂植大幅摆动（Matter 钟摆，会自然衰减）；任何房间点
    <b>「丢几个球」</b>看球下落、撞地反弹、互相碰撞滚动 —— 这些运动是物理算出来的，没人 K 动画。<br>
    对比：其余物品的"呼吸"是 tween（规律重复），物理是"有机、不重复"。<br>
    层（后→前）：L0 背景 · L1 远景 · L2 组件(按深度) · L3 角色 · L4 活光顶层。
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script type="module">
import {
  objectFx, autoLayout, objectDepth, PHYSICS, ROOM_NAME, ROOM_ORDER,
} from "/static/js/worldViewAdapter.js";

const W = 960, H = 540;
const ROOM_BG = {
  bedroom: "/static/img/world/room-bedroom-v1.png",
  kitchen: "/static/img/world/room-kitchen-v1.png",
  living_room: "/static/img/world/room-living-v1.png",
  balcony: "/static/img/world/room-balcony-v1.png",
  entryway: "/static/img/world/scene-entryway-v1.svg",
  building_entrance: "/static/img/world/scene-building-entrance-v1.svg",
  cafe: "/static/img/world/scene-cafe-v1.svg",
  convenience_store: "/static/img/world/scene-convenience-store-v1.svg",
  park: "/static/img/world/scene-park-v1.svg",
};
// 层深度（Phaser depth 带）：组件永远 < 角色；活光在最顶。codex 扩展时遵守这个分带。
const DEPTHS = { BG: 0, FAR: 10, PROP: 20, CHAR: 50, LIGHT: 60 };

let game = null;
window.__world = null;   // 当前世界快照，scene 每拍读它（轮询更新）

function token() {
  return document.getElementById("tok").value.trim() || localStorage.getItem("neno_admin_token") || "";
}
function setStatus(s) { document.getElementById("status").textContent = s; }
async function fetchWorld() {
  const t = token();
  if (!t) { setStatus("没有 Admin Token：先在控制台登录，或粘到上面的框里。"); return null; }
  try {
    const r = await fetch("/debug/consciousness/world-live", { headers: { "X-Admin-Token": t } });
    const d = await r.json();
    if (!d || !d.world) { setStatus("世界暂无数据：" + (d && d.reason || "")); return null; }
    return d.world;
  } catch (e) { setStatus("拉取失败：" + e.message); return null; }
}

// ── 世界场景：渲染器是"状态的纯函数"，每拍读快照 diff 更新精灵 ──────────────
class WorldScene extends Phaser.Scene {
  constructor() {
    super("world");
    this.roomKey = "living_room";   // Phase 1 codex 扩成多房间 + 相机切换
    this.sprites = {};              // key -> 静态精灵
    this.phys = {};                 // key -> 物理件
    this.prevState = {};
    this.followHer = true;
  }
  preload() {
    this.load.on("loaderror", (file) => console.warn("Room background failed to load:", file.key));
    for (const [k, p] of Object.entries(ROOM_BG)) this.load.image("bg-" + k, p);
  }
  create() {
    // L0 背景板（死光烤在图里）
    this.bg = this.add.image(W / 2, H / 2, "bg-living_room").setDepth(DEPTHS.BG);
    this.bg.setScale(Math.max(W / this.bg.width, H / this.bg.height)).setAlpha(0.95);
    // L1 远景层（窗外，Phase 6 填昼夜/天气）— 先放空容器占位
    this.farLayer = this.add.container(0, 0).setDepth(DEPTHS.FAR);
    // L3 角色层（Neno）— 占位
    this.character = this.add.text(W * 0.42, H * 0.72, "🧍", { fontSize: "40px" })
      .setOrigin(0.5).setDepth(DEPTHS.CHAR).setAlpha(0.85);
    // L4 活光/氛围顶层（Phase 6 填动态光/粒子）— 先放空容器 + 轻压暗让精灵跳出
    this.add.rectangle(W / 2, H / 2, W, H, 0x0e0c12, 0.14).setDepth(DEPTHS.LIGHT - 1);
    this.lightLayer = this.add.container(0, 0).setDepth(DEPTHS.LIGHT);

    // 物理世界边界（地面/墙），丢的球会落地反弹、互撞
    this.matter.world.setBounds(0, 0, W, H);

    // 物理演示件：Phase 0 保证你能看到"有机摆"。codex Phase 3 改成由 PHYSICS 表驱动真实物品后删除。
    this.makeDemoPendulum();

    // 渲染循环（状态→渲染，每 200ms diff 一次内存快照）
    const tick = () => {
      if (this.followHer && window.__world && window.__world.location !== this.roomKey) {
        this.setRoom(window.__world.location);
      }
      if (window.__world) this.renderRoom(window.__world);
    };
    tick();
    this.time.addEvent({ delay: 200, loop: true, callback: tick });
  }

  setRoom(roomKey) {
    if (roomKey === this.roomKey || !this.textures.exists("bg-" + roomKey)) return;
    const cam = this.cameras.main;
    cam.fadeOut(180, 14, 12, 18);
    cam.once("camerafadeoutcomplete", () => {
      this.roomKey = roomKey;
      this.bg.setTexture("bg-" + roomKey);
      this.bg.setScale(Math.max(W / this.bg.width, H / this.bg.height));
      this.clearRoomSprites();
      if (window.__world) this.renderRoom(window.__world);
      if (this.demoPendulum) this.demoPendulum.setVisible(roomKey === "living_room");
      cam.fadeIn(180, 14, 12, 18);
    });
  }

  clearRoomSprites() {
    for (const k of Object.keys(this.sprites)) { this.sprites[k].destroy(); }
    for (const k of Object.keys(this.phys)) { if (this.phys[k].sprite) this.phys[k].sprite.destroy(); }
    this.sprites = {}; this.phys = {}; this.prevState = {};
  }

  makeDemoPendulum() {
    const ax = W * 0.86, ay = H * 0.06, len = 150;
    this.pendGfx = this.add.graphics().setDepth(DEPTHS.PROP + 5);   // 绳：每帧重画跟着摆
    const t = this.add.text(ax, ay + len, "🪴", { fontSize: "48px" }).setOrigin(0.5).setDepth(DEPTHS.PROP + 6);
    const body = this.matter.add.gameObject(t);
    body.setCircle(20);
    body.setFrictionAir(0.004);            // 阻尼小 → 摆得久、看得清
    this.matter.add.worldConstraint(body, len, 0.95, { pointA: { x: ax, y: ay } });
    this.pendAnchor = { x: ax, y: ay };
    this.time.addEvent({ delay: 1600, loop: true, callback: () =>
      body.applyForce(new Phaser.Math.Vector2((Math.random() - 0.4) * 0.006, 0)) });  // 来阵风，幅度大
    body.applyForce(new Phaser.Math.Vector2(0.02, 0));   // 起手用力推，明显荡起来
    this.demoPendulum = body;
  }

  // 丢几个会落地反弹、互相碰撞的球 —— 一眼就是物理
  dropBalls() {
    const colors = [0xef9f27, 0x5dcaa5, 0xe24b4a, 0x85b7eb, 0xc77fae];
    for (let i = 0; i < 6; i++) {
      const r = 14 + Math.random() * 10;
      const c = this.add.circle(120 + Math.random() * (W - 240), 30, r, colors[i % colors.length])
        .setDepth(DEPTHS.PROP + 8);
      const b = this.matter.add.gameObject(c);
      b.setCircle(r);
      b.setBounce(0.72);
      b.setFriction(0.02);
      b.applyForce(new Phaser.Math.Vector2((Math.random() - 0.5) * 0.01, 0));
    }
  }

  update() {
    // 绳每帧跟着摆动的挂植重画
    if (this.pendGfx && this.demoPendulum && this.pendAnchor) {
      this.pendGfx.clear();
      if (this.demoPendulum.visible) {
        this.pendGfx.lineStyle(2, 0x6a5a4a, 1);
        this.pendGfx.lineBetween(this.pendAnchor.x, this.pendAnchor.y, this.demoPendulum.x, this.demoPendulum.y);
      }
    }
  }

  // 单房间渲染。codex Phase 1 把它扩成多房间 + 相机；Phase 3 实现 ensurePhysics 的真物理。
  renderRoom(world) {
    const objs = (world.rooms && world.rooms[this.roomKey] && world.rooms[this.roomKey].objects) || [];
    const auto = autoLayout(objs);
    const present = new Set();
    for (const o of objs) {
      present.add(o.key);
      const slot = auto[o.key] || { x: 50, y: 60, size: 22 };
      if (PHYSICS[o.key]) { this.ensurePhysics(o, slot); continue; }  // 物理件走物理路径
      const fx = objectFx(o.key, o.state);
      let s = this.sprites[o.key];
      if (!s) {
        s = this.add.text(0, 0, "", { fontSize: "30px" }).setOrigin(0.5);
        this.tweens.add({ targets: s, scale: 1.08, yoyo: true, repeat: -1,
          duration: 1700 + Math.random() * 700, ease: "Sine.easeInOut" });   // 常驻呼吸
        this.sprites[o.key] = s;
      }
      s.setPosition(slot.x / 100 * W, slot.y / 100 * H);
      s.setText(fx.emoji || o.emoji || "▫️");                      // TODO Phase 7: fx.img → this.add.image
      s.setDepth(objectDepth(o.category, slot.y / 100));            // 深度排序：越低越靠前
      s.setAlpha(fx.dim ? 0.45 : 1);
      s.setAngle(fx.tip ? 72 : 0);
      if (this.prevState[o.key] !== undefined && this.prevState[o.key] !== o.state) {
        this.tweens.add({ targets: s, scale: 1.4, yoyo: true, duration: 160, ease: "Quad.easeOut" });  // 手感
      }
      this.prevState[o.key] = o.state;
    }
    for (const k of Object.keys(this.sprites)) {
      if (!present.has(k)) { this.sprites[k].destroy(); delete this.sprites[k]; }   // 清理被扔掉的
    }
  }

  // ⬇⬇ codex Phase 3 在这里实现真物理：按 PHYSICS[o.key].type 建 pendulum/cloth/drop。
  // 现在是占位：当普通精灵处理，保证不报错。
  ensurePhysics(o, slot) {
    let p = this.phys[o.key];
    if (!p) {
      const s = this.add.text(slot.x / 100 * W, slot.y / 100 * H, "", { fontSize: "30px" })
        .setOrigin(0.5).setDepth(DEPTHS.PROP + 4);
      p = this.phys[o.key] = { sprite: s };
    }
    p.sprite.setText(objectFx(o.key, o.state).emoji || o.emoji || "▫️");
  }
}

async function connect() {
  setStatus("连接中…");
  const w = await fetchWorld();
  if (!w) return;
  window.__world = w;
  const n = (w.rooms.living_room && w.rooms.living_room.objects.length) || 0;
  setStatus(`已连接。客厅物品：${n} 件。每 3 秒刷新。`);
  if (!game) {
    game = new Phaser.Game({
      type: Phaser.AUTO, width: W, height: H, parent: "game", backgroundColor: "#0e0c12",
      physics: { default: "matter", matter: { gravity: { x: 0, y: 1 }, debug: false } },
      scene: WorldScene,
    });
  }
  setInterval(async () => { const nw = await fetchWorld(); if (nw) window.__world = nw; }, 3000);
}

document.getElementById("go").addEventListener("click", connect);
document.getElementById("bump").addEventListener("click", () => {
  const s = game && game.scene.getScene("world");
  if (s && s.demoPendulum) s.demoPendulum.applyForce(new Phaser.Math.Vector2(0.03, 0));
});
document.getElementById("drop").addEventListener("click", () => {
  const s = game && game.scene.getScene("world");
  if (s && s.dropBalls) s.dropBalls();
});
const rooms = document.getElementById("rooms");
for (const key of ROOM_ORDER) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = ROOM_NAME[key] || key;
  button.addEventListener("click", () => {
    const s = game && game.scene.getScene("world");
    if (!s) return;
    s.followHer = false;
    s.setRoom(key);
  });
  rooms.appendChild(button);
}
const followButton = document.createElement("button");
followButton.type = "button";
followButton.textContent = "跟随她";
followButton.addEventListener("click", () => {
  const s = game && game.scene.getScene("world");
  if (!s) return;
  s.followHer = true;
  if (window.__world) s.setRoom(window.__world.location);
});
rooms.appendChild(followButton);
if (localStorage.getItem("neno_admin_token")) connect();
</script>
</body>
</html>
