    <radialGradient id="cfGlow" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffcf86" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffcf86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cfWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4358"/>
      <stop offset="1" stop-color="#5a4a44"/>
    </linearGradient>
  </defs>
  <rect width="1672" height="941" fill="url(#cfWall)"/>
  <rect y="710" width="1672" height="231" fill="url(#cfFloor)"/>
