<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cfWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3326"/>
      <stop offset="0.6" stop-color="#3a2a20"/>
      <stop offset="1" stop-color="#281d16"/>
    </linearGradient>
    <linearGradient id="cfFloor" x1="0" y1="0" x2="0" y2="1">
